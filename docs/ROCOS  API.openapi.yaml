openapi: 3.0.1
info:
  title: ROCOS API
  description: 机器人控制器 HTTP/JSON 接口，替代 gRPC，支持多语言跨平台集成。
  version: 2.0.0
tags:
  - name: 机器人状态与信息
  - name: 基础控制
  - name: 空间运动控制 (Motion)
  - name: 伺服控制 (Servo)
  - name: 点动控制 (Jogging)
  - name: 坐标系管理 (Frame)
  - name: 标定
  - name: Lua 脚本
  - name: 控制权 (Control)
paths:
  /api/robot/state:
    get:
      summary: 获取机器人完整状态快照
      deprecated: false
      description: 包含 FSM 状态、关节数据、笛卡尔位姿（法兰、激活工具系、激活工件系）及硬件总线摘要
      tags:
        - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotStateData'
          headers: {}
      security: []
  /api/robot/info:
    get:
      summary: 获取机器人参数信息
      deprecated: false
      description: 返回各关节的传动比、编码器脉冲数、零点偏移等配置参数
      tags:
        - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotInfoData'
          headers: {}
      security: []
  /api/robot/urdf:
    get:
      summary: 获取机器人 URDF 模型 XML
      deprecated: false
      description: ''
      tags:
        - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 返回 URDF XML 文本
          content:
            text/xml:
              schema:
                type: string
          headers: {}
      security: []
  /api/robot/urdf/mesh:
    get:
      summary: 获取连杆 3D Mesh 文件 (STL)
      deprecated: false
      description: ''
      tags:
        - 机器人状态与信息
      parameters:
        - name: path
          in: query
          description: STL 文件相对路径，支持 package:// 格式
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 二进制文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers: {}
      security: []
  /api/robot/enabled:
    get:
      summary: 查询使能状态
      deprecated: false
      description: ''
      tags:
        - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotEnabledData'
          headers: {}
      security: []
  /api/robot/enable:
    post:
      summary: 全局使能机器人
      deprecated: false
      description: ''
      tags:
        - 基础控制
      parameters: []
      responses:
        '200':
          description: 使能成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/disable:
    post:
      summary: 全局下电 / 关闭使能
      deprecated: false
      description: ''
      tags:
        - 基础控制
      parameters: []
      responses:
        '200':
          description: 下电成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/reset:
    post:
      summary: 清除机器人报警并复位到 STOPPED
      deprecated: false
      description: >
        仅用于 ERROR_STATE。接口会触发状态机 ERROR_STATE → RESETTING， 清除硬件 Fault/Alarm
        后重新使能；成功进入 STOPPED，失败保持 ERROR_STATE。 Stop 只负责停止运动，不负责清除报警。
      tags:
        - 基础控制
      parameters: []
      responses:
        '200':
          description: 复位结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          robot_state:
                            type: string
                            enum:
                              - STOPPED
                              - ERROR_STATE
                          enabled:
                            type: boolean
          headers: {}
      security:
        - ControlToken: []
  /api/robot/workmode:
    post:
      summary: 设置工作模式
      deprecated: false
      description: ''
      tags:
        - 基础控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - position
                    - ee_admit_teach
                    - jnt_admit_teach
                    - jnt_imp
                    - cart_imp
        required: true
      responses:
        '200':
          description: 模式切换成功
          headers: {}
      security:
        - ControlToken: []
  /api/robot/servo/start:
    post:
      summary: 启动 UDP 伺服运动模式
      deprecated: false
      description: >
        进入 SERVOING 状态，在 localhost 上启动 UDP 伺服线程。 机器人开始监听指定端口，接收外部
        MotionGeneratorCommand 并回复 RobotState。
      tags:
        - 伺服控制 (Servo)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                port:
                  type: integer
                  default: 8081
                  description: UDP 监听端口
        required: false
      responses:
        '200':
          description: 伺服模式启动结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/servo/stop:
    post:
      summary: 停止 UDP 伺服运动模式
      deprecated: false
      description: 退出 SERVOING 状态，回到 STOPPED，关闭 UDP 线程和 socket
      tags:
        - 伺服控制 (Servo)
      parameters: []
      responses:
        '200':
          description: 伺服模式停止结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/servo/mode:
    post:
      summary: 设置伺服运动模式
      deprecated: false
      description: 设置伺服模式为关节空间（joint）或笛卡尔空间（cartesian），可在启动前或运行中调用
      tags:
        - 伺服控制 (Servo)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - joint
                    - cartesian
                  description: joint=关节空间位置控制, cartesian=笛卡尔空间位姿控制
        required: true
      responses:
        '200':
          description: 模式切换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/movej:
    post:
      summary: 关节空间运动 (MoveJ)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - joints
              properties:
                joints:
                  type: array
                  description: 目标关节角度 [rad]，长度必须等于机器人关节数
                  items:
                    type: number
                velocity:
                  type: number
                  default: 1
                  description: 速度限制
                acceleration:
                  type: number
                  default: 2
                jerk:
                  type: number
                  default: 10
        required: true
      responses:
        '200':
          description: 运动请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/movej_ik:
    post:
      summary: 笛卡尔位姿逆解运动 (MoveJ_IK)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - pose
              properties:
                pose:
                  $ref: '#/components/schemas/Pose'
                velocity:
                  type: number
                  default: 1
                acceleration:
                  type: number
                  default: 2
                jerk:
                  type: number
                  default: 10
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/movel:
    post:
      summary: 笛卡尔直线运动 (MoveL)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - pose
              properties:
                pose:
                  $ref: '#/components/schemas/Pose'
                tool_name:
                  type: string
                  description: 可选，指定使用的工具坐标系名称
                velocity:
                  type: number
                  default: 1
                acceleration:
                  type: number
                  default: 2
                jerk:
                  type: number
                  default: 10
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/movel_fk:
    post:
      summary: 关节空间直线运动 (MoveL_FK)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - joints
              properties:
                joints:
                  type: array
                  description: 目标关节角度 [rad]
                  items:
                    type: number
                tool_name:
                  type: string
                  description: 可选，指定使用的工具坐标系名称
                velocity:
                  type: number
                  default: 1
                acceleration:
                  type: number
                  default: 2
                jerk:
                  type: number
                  default: 10
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/movec:
    post:
      summary: 笛卡尔圆弧运动 (MoveC)
      deprecated: false
      description: >
        支持两种模式：圆心+角度 (center_frame + theta) 或三点圆弧 (pose_via + pose_goal)。
        pose_start 可选，默认当前法兰位姿。
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pose_start:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧起点，默认当前法兰位姿
                center_frame:
                  $ref: '#/components/schemas/Pose'
                  description: 圆心位姿（与 theta 配合）
                theta:
                  type: number
                  description: 圆弧角度 [rad]（与 center_frame 配合）
                pose_via:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧经过点（与 pose_goal 配合）
                pose_goal:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧终点（与 pose_via 配合）
                pose_to:
                  $ref: '#/components/schemas/Pose'
                  description: pose_goal 的别名
                velocity:
                  type: number
                  default: 1
                acceleration:
                  type: number
                  default: 2
                jerk:
                  type: number
                  default: 10
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/pause:
    post:
      summary: 暂停运动
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      responses:
        '200':
          description: 暂停请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/resume:
    post:
      summary: 继续运动
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      responses:
        '200':
          description: 继续请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/stop:
    post:
      summary: 停止运动
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      responses:
        '200':
          description: 停止请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/wait_move:
    post:
      summary: 等待当前运动结束（阻塞）
      deprecated: false
      description: 先延时 20ms，再轮询 FSM 直到运动完成或进入 ERROR_STATE
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      responses:
        '200':
          description: 运动结束或出错
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/move_status:
    get:
      summary: 查询运动/任务状态
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters:
        - name: task_id
          in: query
          description: ''
          required: false
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 返回机器人状态与任务信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MoveStatusData'
          headers: {}
      security: []
  /api/robot/jog/joint:
    post:
      summary: 关节点动
      deprecated: false
      description: 传入与关节数等长的方向向量，每个元素为该关节的速度方向
      tags:
        - 点动控制 (Jogging)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - joints
              properties:
                joints:
                  type: array
                  description: 关节方向向量，长度等于机器人关节数
                  items:
                    type: number
                direction:
                  type: string
                  enum:
                    - POSITIVE
                    - NEGATIVE
                  default: POSITIVE
                  description: 向量整体缩放符号（乘到每个元素上）
                speed:
                  type: number
                  default: 1
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
        required: true
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/jog/cartesian:
    post:
      summary: 笛卡尔点动
      deprecated: false
      description: >
        传入 6 维 twist 向量 [vx, vy, vz, wx, wy, wz]，前 3 个为线速度，后 3 个为角速度。 可通过 frame
        参数指定参考坐标系；Robot 层会将 FLANGE/TOOL/OBJECT 下的 twist 旋转到 BASE 后执行。
      tags:
        - 点动控制 (Jogging)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - twist
              properties:
                twist:
                  type: array
                  description: 6 维 twist [vx, vy, vz, wx, wy, wz]
                  minItems: 6
                  maxItems: 6
                  items:
                    type: number
                frame:
                  type: string
                  enum:
                    - BASE
                    - FLANGE
                    - TOOL
                    - OBJECT
                  default: BASE
                  description: >
                    点动参考坐标系。BASE 表示 twist 已经在基坐标系表达； FLANGE 表示 twist 在当前法兰坐标系表达；
                    TOOL 表示 twist 在当前激活工具坐标系表达； OBJECT 表示 twist 在当前激活工件坐标系表达。
                direction:
                  type: string
                  enum:
                    - POSITIVE
                    - NEGATIVE
                  default: POSITIVE
                speed:
                  type: number
                  default: 1
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
        required: true
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/jog/nullspace:
    post:
      summary: 零空间点动
      deprecated: false
      description: 传入与关节数等长的方向向量，在不影响末端位姿的零空间内运动
      tags:
        - 点动控制 (Jogging)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - joints
              properties:
                joints:
                  type: array
                  description: 关节方向向量，长度等于机器人关节数
                  items:
                    type: number
                direction:
                  type: string
                  enum:
                    - POSITIVE
                    - NEGATIVE
                  default: POSITIVE
                speed:
                  type: number
                  default: 1
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
        required: true
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/jog/svd:
    post:
      summary: SVD 维度速度点动
      deprecated: false
      description: 传入各维度的速度标量数组
      tags:
        - 点动控制 (Jogging)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - dim_speeds
              properties:
                dim_speeds:
                  type: array
                  description: 各维度速度标量
                  items:
                    type: number
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
        required: true
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/jog/stop:
    post:
      summary: 停止点动
      deprecated: false
      description: ''
      tags:
        - 点动控制 (Jogging)
      parameters: []
      responses:
        '200':
          description: 停止成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'
          headers: {}
      security:
        - ControlToken: []
  /api/robot/tool_frames:
    get:
      summary: 获取所有工具坐标系名称列表
      deprecated: false
      description: ''
      tags:
        - 坐标系管理 (Frame)
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FrameNameList'
          headers: {}
      security: []
  /api/robot/object_frames:
    get:
      summary: 获取所有工件坐标系名称列表
      deprecated: false
      description: ''
      tags:
        - 坐标系管理 (Frame)
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FrameNameList'
          headers: {}
      security: []
  /api/robot/tool_frame:
    get:
      summary: 查询指定工具坐标系
      deprecated: false
      description: ''
      tags:
        - 坐标系管理 (Frame)
      parameters:
        - name: name
          in: query
          description: ''
          required: true
          example: ''
          schema:
            type: string
      responses:
        '200':
          description: 成功或未找到
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NamedFrame'
          headers: {}
      security: []
    post:
      summary: 设置/新增工具坐标系
      deprecated: false
      description: ''
      tags:
        - 坐标系管理 (Frame)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - frame
              properties:
                name:
                  type: string
                  description: 坐标系名称（字母/数字/下划线/短横/点号，≤64 字符）
                frame:
                  $ref: '#/components/schemas/Pose'
                pose:
                  $ref: '#/components/schemas/Pose'
                  description: frame 的别名
        required: true
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                allOf:
