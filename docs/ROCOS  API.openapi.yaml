  /api/control/acquire:
    post:
      summary: 申请机器人控制权
      description: >
        无持有者时颁发新 UUID token 并返回。若已有持有者且未过期，返回 `code=3008`。
        该 token 仅绑定到当前连接的 `remote_addr:remote_port`；同一台机器上的不同连接即使 IP 相同也必须重新申请。
        携带此 token（`X-Rocos-Control-Token` header）方可调用写接口。TTL 60s，任何调用自动续期。
      tags:
        - 控制权 (Control)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                  description: 客户端自报名称，写入日志与 /status 供审计
                client_id:
                  type: string
                  description: 稳定的客户端会话 ID；浏览器端口变化时可保持同一用户/会话持有 token
        required: false
      responses:
        '200':
          description: 申请结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ControlOwnerData'
      security: []
  /api/control/release:
    post:
      summary: 释放机器人控制权
      description: 必须携带匹配当前持有者的 `X-Rocos-Control-Token`。
      tags:
        - 控制权 (Control)
      parameters: []
      responses:
        '200':
          description: 释放结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
      security:
        - ControlToken: []
  /api/control/takeover:
    post:
      summary: 强制抢占控制权
      description: 无条件覆盖当前持有者，颁发新 token；原 token 立即失效。日志中记录被抢占的原持有者信息。
      tags:
        - 控制权 (Control)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
        required: false
      responses:
        '200':
          description: 抢占结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ControlOwnerData'
      security: []
  /api/control/status:
    get:
      summary: 查询控制权状态
      description: 无需鉴权。返回当前持有者信息与剩余 TTL；若 token 已过期会先做懒清理。
      tags:
        - 控制权 (Control)
      parameters: []
      responses:
        '200':
          description: 状态快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ControlOwnerData'
      security: []
components:
  schemas:
    StandardResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
        code:
          type: integer
          description: >
            业务状态码。0: 成功, 1xxx: 参数错误, 2xxx: 运动/规划错误, 3xxx: 状态错误, 4xxx: 标定错误,
            5xxx: 异步任务错误, -6xxx: Lua 错误
        message:
          type: string
        data:
          type: object
          properties: {}
          nullable: true
    Pose:
      type: object
      properties:
        position:
          type: object
          properties:
            x:
              type: number
              default: 0
            'y':
              type: number
              default: 0
            z:
              type: number
              default: 0
        orientation:
          type: object
          properties:
            x:
              type: number
              default: 0
            'y':
              type: number
              default: 0
            z:
              type: number
              default: 0
            w:
              type: number
              default: 1
    RobotStateData:
      type: object
      properties:
        robot_state:
          type: string
          enum:
            - IDLE
            - ENABLING
            - DISABLING
            - STARTING
            - STOPPING
            - PAUSING
            - RESUMING
            - RESETTING
            - RUNNING
            - PAUSED
            - STOPPED
            - SERVOING
            - ERROR_STATE
        work_mode:
          type: string
          enum:
            - position
            - ee_admit_teach
            - jnt_admit_teach
            - jnt_imp
            - cart_imp
          description: 当前工作模式
        is_enabled:
          type: boolean
        is_running:
          type: boolean
        control_active:
          type: boolean
        motion_busy:
          type: boolean
        timestamp:
          type: number
          description: 快照时刻 (epoch seconds)
        joint_states:
          type: array
          items:
            $ref: '#/components/schemas/JointState'
        flange:
          $ref: '#/components/schemas/Pose'
        active_tool_frame_name:
          type: string
        active_tool_frame:
          $ref: '#/components/schemas/Pose'
        active_object_frame_name:
          type: string
        active_object_frame:
          $ref: '#/components/schemas/Pose'
        hw_state:
          $ref: '#/components/schemas/HardwareState'
    JointState:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: number
        velocity:
          type: number
        torque:
          type: number
        load_torque:
          type: number
        status:
          type: integer
          description: '0: disabled, 1: fault, 2: enabled'
    HardwareState:
      type: object
      properties:
        joint_num:
          type: integer
        state:
          type: integer
          description: '0: DISABLED, 1: ENABLED, 2: ERROR'
    RobotInfoData:
      type: object
      properties:
        joint_infos:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              cnt_per_unit:
                type: number
              torque_per_unit:
                type: number
              ratio:
                type: number
              unit_name:
                type: string
              zero_offset:
                type: integer
    RobotEnabledData:
      type: object
      properties:
        enabled:
          type: boolean
        disabled:
          type: boolean
        robot_state:
          type: string
    MotionResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                robot_state:
                  type: string
                control_active:
                  type: boolean
                motion_busy:
                  type: boolean
                  description: WaitMove 专用
    MoveStatusData:
      type: object
      properties:
        robot_state:
          type: string
        is_running:
          type: boolean
        control_active:
          type: boolean
        task_id:
          type: string
        task:
          type: object
          properties: {}
          nullable: true
    FrameNameList:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
        active:
          type: string
          description: 当前激活的坐标系名称
    NamedFrame:
      type: object
      properties:
        name:
          type: string
        frame:
          $ref: '#/components/schemas/Pose'
    FramesSnapshot:
      type: object
      properties:
        path:
          type: string
        tool_frames:
          type: array
          items:
            type: string
        object_frames:
          type: array
          items:
            type: string
        active_tool_frame:
          type: string
        active_object_frame:
          type: string
    ScriptUploadRequest:
      type: object
      required:
        - filename
        - source
      properties:
        filename:
          type: string
        source:
          type: string
          description: UTF-8 Lua 源码
    ScriptBreakpointRequest: &ref_0
      type: object
      required:
        - filename
        - line
      properties:
        filename:
          type: string
        line:
          type: integer
          minimum: 1
    ScriptBreakpoint: *ref_0
    ScriptStatusData:
      type: object
      required:
        - state
        - script_id
        - filename
        - line
        - error
        - motion_active
        - breakpoints
      properties:
        state:
          type: string
          enum:
            - EMPTY
            - LOADED
            - RUNNING
            - PAUSING
            - PAUSED
            - STOPPING
            - COMPLETED
            - FAILED
            - STOPPED
        script_id:
          type: string
        filename:
          type: string
        line:
          type: integer
          minimum: 0
        error:
          type: string
        motion_active:
          type: boolean
        breakpoints:
          type: array
          items:
            $ref: '#/components/schemas/ScriptBreakpoint'
    ScriptResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ScriptStatusData'
    ControlOwnerData:
      type: object
      properties:
        token:
          type: string
          description: 仅在 acquire/takeover 成功响应中返回；status/release 中不返回
        has_owner:
          type: boolean
        owner_ip:
          type: string
        owner_port:
          type: integer
          description: 当前控制权持有连接的远端端口，区分同一 IP 的不同连接
        owner_connection:
          type: string
          description: 连网键 `remote_addr:remote_port`，同 IP 但不同 socket 会被视作不同 owner
        owner_client_id:
          type: string
          description: 稳定客户端会话 ID；浏览器端口变更时仍可保证同一前端会话继续持有 token
        owner_name:
          type: string
        owner_agent:
          type: string
          description: 客户端 User-Agent
        held_for_seconds:
          type: integer
          description: 自 acquire 起已持有的秒数
        idle_seconds:
          type: integer
          description: 自上次续期起的空闲秒数
        expires_in_seconds:
          type: integer
          description: 距离 TTL 到期的剩余秒数
        ttl_seconds:
          type: integer
          description: 常量 60
  responses: {}
  securitySchemes:
    ControlToken:
      type: apiKey
      in: header
      name: X-Rocos-Control-Token
      description: >
        单持有者控制权令牌。通过 POST /api/control/acquire 或 /api/control/takeover 获取。
        若客户端带上稳定的 `X-Rocos-Client-Id`，同一浏览器会话在端口变化时可继续持有同一个 token；
        若来自不同 `client_id` 且不是同一连接，则返回 3007。
        所有写接口必须携带；缺失返回 3006，无效/过期返回 3007。详见 docs/http_api_control_rights.md。
