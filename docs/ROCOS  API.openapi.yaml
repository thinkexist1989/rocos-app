openapi: 3.0.1
info:
  title: ROCOS API
  description: 机器人控制器 HTTP/JSON 接口，替代 gRPC，支持多语言跨平台集成。
  version: 2.0.0
tags:
  - name: 机器人状态与信息
  - name: 基础控制
  - name: 空间运动控制 (Motion)
  - name: 点动控制 (Jogging)
  - name: 坐标系管理 (Frame)
  - name: 标定
  - name: Lua 脚本
paths:
  # ==========================================================================
  # 机器人状态与信息
  # ==========================================================================
  /api/robot/state:
    get:
      summary: 获取机器人完整状态快照
      description: 包含 FSM 状态、关节数据、笛卡尔位姿（法兰、激活工具系、激活工件系）及硬件总线摘要
      tags: [机器人状态与信息]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotStateData'

  /api/robot/info:
    get:
      summary: 获取机器人参数信息
      description: 返回各关节的传动比、编码器脉冲数、零点偏移等配置参数
      tags: [机器人状态与信息]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotInfoData'

  /api/robot/urdf:
    get:
      summary: 获取机器人 URDF 模型 XML
      tags: [机器人状态与信息]
      responses:
        '200':
          description: 返回 URDF XML 文本
          content:
            text/xml:
              schema:
                type: string

  /api/robot/urdf/mesh:
    get:
      summary: 获取连杆 3D Mesh 文件 (STL)
      tags: [机器人状态与信息]
      parameters:
        - name: path
          in: query
          description: STL 文件相对路径，支持 package:// 格式
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 二进制文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/robot/enabled:
    get:
      summary: 查询使能状态
      tags: [机器人状态与信息]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotEnabledData'

  # ==========================================================================
  # 基础控制
  # ==========================================================================
  /api/robot/enable:
    post:
      summary: 全局使能机器人
      tags: [基础控制]
      responses:
        '200':
          description: 使能成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/robot/disable:
    post:
      summary: 全局下电 / 关闭使能
      tags: [基础控制]
      responses:
        '200':
          description: 下电成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/robot/reset:
    post:
      summary: 清除机器人报警并复位到 STOPPED
      description: >
        仅用于 ERROR_STATE。接口会触发状态机 ERROR_STATE → RESETTING，
        清除硬件 Fault/Alarm 后重新使能；成功进入 STOPPED，失败保持 ERROR_STATE。
        Stop 只负责停止运动，不负责清除报警。
      tags: [基础控制]
      responses:
        '200':
          description: 复位结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          robot_state:
                            type: string
                            enum: [STOPPED, ERROR_STATE]
                          enabled:
                            type: boolean

  /api/robot/workmode:
    post:
      summary: 设置工作模式
      tags: [基础控制]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum:
                    - position
                    - ee_admit_teach
                    - jnt_admit_teach
                    - jnt_imp
                    - cart_imp
      responses:
        '200':
          description: 模式切换成功

  # ==========================================================================
  # 空间运动控制 (Motion)
  # ==========================================================================
  /api/robot/movej:
    post:
      summary: 关节空间运动 (MoveJ)
      tags: [空间运动控制 (Motion)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joints]
              properties:
                joints:
                  type: array
                  description: 目标关节角度 [rad]，长度必须等于机器人关节数
                  items:
                    type: number
                velocity:
                  type: number
                  default: 1.0
                  description: 速度限制
                acceleration:
                  type: number
                  default: 2.0
                jerk:
                  type: number
                  default: 10.0
      responses:
        '200':
          description: 运动请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/movej_ik:
    post:
      summary: 笛卡尔位姿逆解运动 (MoveJ_IK)
      tags: [空间运动控制 (Motion)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pose]
              properties:
                pose:
                  $ref: '#/components/schemas/Pose'
                velocity:
                  type: number
                  default: 1.0
                acceleration:
                  type: number
                  default: 2.0
                jerk:
                  type: number
                  default: 10.0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/movel:
    post:
      summary: 笛卡尔直线运动 (MoveL)
      tags: [空间运动控制 (Motion)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pose]
              properties:
                pose:
                  $ref: '#/components/schemas/Pose'
                tool_name:
                  type: string
                  description: 可选，指定使用的工具坐标系名称
                velocity:
                  type: number
                  default: 1.0
                acceleration:
                  type: number
                  default: 2.0
                jerk:
                  type: number
                  default: 10.0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/movel_fk:
    post:
      summary: 关节空间直线运动 (MoveL_FK)
      tags: [空间运动控制 (Motion)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joints]
              properties:
                joints:
                  type: array
                  description: 目标关节角度 [rad]
                  items:
                    type: number
                tool_name:
                  type: string
                  description: 可选，指定使用的工具坐标系名称
                velocity:
                  type: number
                  default: 1.0
                acceleration:
                  type: number
                  default: 2.0
                jerk:
                  type: number
                  default: 10.0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/movec:
    post:
      summary: 笛卡尔圆弧运动 (MoveC)
      description: >
        支持两种模式：圆心+角度 (center_frame + theta) 或三点圆弧 (pose_via + pose_goal)。
        pose_start 可选，默认当前法兰位姿。
      tags: [空间运动控制 (Motion)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pose_start:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧起点，默认当前法兰位姿
                center_frame:
                  $ref: '#/components/schemas/Pose'
                  description: 圆心位姿（与 theta 配合）
                theta:
                  type: number
                  description: 圆弧角度 [rad]（与 center_frame 配合）
                pose_via:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧经过点（与 pose_goal 配合）
                pose_goal:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧终点（与 pose_via 配合）
                pose_to:
                  $ref: '#/components/schemas/Pose'
                  description: pose_goal 的别名
                velocity:
                  type: number
                  default: 1.0
                acceleration:
                  type: number
                  default: 2.0
                jerk:
                  type: number
                  default: 10.0
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/pause:
    post:
      summary: 暂停运动
      tags: [空间运动控制 (Motion)]
      responses:
        '200':
          description: 暂停请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/resume:
    post:
      summary: 继续运动
      tags: [空间运动控制 (Motion)]
      responses:
        '200':
          description: 继续请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/stop:
    post:
      summary: 停止运动
      tags: [空间运动控制 (Motion)]
      responses:
        '200':
          description: 停止请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/wait_move:
    post:
      summary: 等待当前运动结束（阻塞）
      description: 先延时 20ms，再轮询 FSM 直到运动完成或进入 ERROR_STATE
      tags: [空间运动控制 (Motion)]
      responses:
        '200':
          description: 运动结束或出错
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/move_status:
    get:
      summary: 查询运动/任务状态
      tags: [空间运动控制 (Motion)]
      parameters:
        - name: task_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 返回机器人状态与任务信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MoveStatusData'

  # ==========================================================================
  # 点动控制 (Jogging) — 全部使用向量传递
  # ==========================================================================
  /api/robot/jog/joint:
    post:
      summary: 关节点动
      description: 传入与关节数等长的方向向量，每个元素为该关节的速度方向
      tags: [点动控制 (Jogging)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joints]
              properties:
                joints:
                  type: array
                  description: 关节方向向量，长度等于机器人关节数
                  items:
                    type: number
                direction:
                  type: string
                  enum: [POSITIVE, NEGATIVE]
                  default: POSITIVE
                  description: 向量整体缩放符号（乘到每个元素上）
                speed:
                  type: number
                  default: 1.0
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/jog/cartesian:
    post:
      summary: 笛卡尔点动
      description: >
        传入 6 维 twist 向量 [vx, vy, vz, wx, wy, wz]，前 3 个为线速度，后 3 个为角速度。
        可通过 frame 参数指定参考坐标系；Robot 层会将 FLANGE/TOOL/OBJECT 下的 twist 旋转到 BASE 后执行。
      tags: [点动控制 (Jogging)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [twist]
              properties:
                twist:
                  type: array
                  description: 6 维 twist [vx, vy, vz, wx, wy, wz]
                  minItems: 6
                  maxItems: 6
                  items:
                    type: number
                frame:
                  type: string
                  enum: [BASE, FLANGE, TOOL, OBJECT]
                  default: BASE
                  description: >
                    点动参考坐标系。BASE 表示 twist 已经在基坐标系表达；
                    FLANGE 表示 twist 在当前法兰坐标系表达；
                    TOOL 表示 twist 在当前激活工具坐标系表达；
                    OBJECT 表示 twist 在当前激活工件坐标系表达。
                direction:
                  type: string
                  enum: [POSITIVE, NEGATIVE]
                  default: POSITIVE
                speed:
                  type: number
                  default: 1.0
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/jog/nullspace:
    post:
      summary: 零空间点动
      description: 传入与关节数等长的方向向量，在不影响末端位姿的零空间内运动
      tags: [点动控制 (Jogging)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [joints]
              properties:
                joints:
                  type: array
                  description: 关节方向向量，长度等于机器人关节数
                  items:
                    type: number
                direction:
                  type: string
                  enum: [POSITIVE, NEGATIVE]
                  default: POSITIVE
                speed:
                  type: number
                  default: 1.0
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/jog/svd:
    post:
      summary: SVD 维度速度点动
      description: 传入各维度的速度标量数组
      tags: [点动控制 (Jogging)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dim_speeds]
              properties:
                dim_speeds:
                  type: array
                  description: 各维度速度标量
                  items:
                    type: number
                timeout:
                  type: number
                  default: 0.1
                dir_threshold:
                  type: number
                  default: 0.99
      responses:
        '200':
          description: 点动请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  /api/robot/jog/stop:
    post:
      summary: 停止点动
      tags: [点动控制 (Jogging)]
      responses:
        '200':
          description: 停止成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionResponse'

  # ==========================================================================
  # 坐标系管理 (Frame)
  # ==========================================================================
  /api/robot/tool_frames:
    get:
      summary: 获取所有工具坐标系名称列表
      tags: [坐标系管理 (Frame)]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FrameNameList'

  /api/robot/object_frames:
    get:
      summary: 获取所有工件坐标系名称列表
      tags: [坐标系管理 (Frame)]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FrameNameList'

  /api/robot/tool_frame:
    get:
      summary: 查询指定工具坐标系
      tags: [坐标系管理 (Frame)]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功或未找到
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NamedFrame'
    post:
      summary: 设置/新增工具坐标系
      tags: [坐标系管理 (Frame)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, frame]
              properties:
                name:
                  type: string
                  description: 坐标系名称（字母/数字/下划线/短横/点号，≤64 字符）
                frame:
                  $ref: '#/components/schemas/Pose'
                pose:
                  $ref: '#/components/schemas/Pose'
                  description: frame 的别名
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NamedFrame'
    delete:
      summary: 删除指定工具坐标系
      tags: [坐标系管理 (Frame)]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/robot/object_frame:
    get:
      summary: 查询指定工件坐标系
      tags: [坐标系管理 (Frame)]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功或未找到
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NamedFrame'
    post:
      summary: 设置/新增工件坐标系
      tags: [坐标系管理 (Frame)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, frame]
              properties:
                name:
                  type: string
                frame:
                  $ref: '#/components/schemas/Pose'
                pose:
                  $ref: '#/components/schemas/Pose'
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/NamedFrame'
    delete:
      summary: 删除指定工件坐标系
      tags: [坐标系管理 (Frame)]
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/robot/active_tool_frame:
    post:
      summary: 激活指定工具坐标系
      tags: [坐标系管理 (Frame)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/robot/active_object_frame:
    post:
      summary: 激活指定工件坐标系
      tags: [坐标系管理 (Frame)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/robot/frames/load:
    post:
      summary: 从 YAML 文件加载坐标系
      tags: [坐标系管理 (Frame)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: YAML 文件路径
      responses:
        '200':
          description: 加载结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FramesSnapshot'

  /api/robot/frames/save:
    post:
      summary: 保存坐标系到 YAML 文件
      tags: [坐标系管理 (Frame)]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FramesSnapshot'

  # ==========================================================================
  # 标定
  # ==========================================================================
  /api/calibration/pose:
    post:
      summary: 设置标定点位
      deprecated: true
      description: 当前未实现，返回 code=1004
      tags: [标定]
      responses:
        '200':
          description: 未实现
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/calibration/tool:
    post:
      summary: 设置工具坐标系（等同 POST /api/robot/tool_frame）
      tags: [标定]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, frame]
              properties:
                name:
                  type: string
                frame:
                  $ref: '#/components/schemas/Pose'
                pose:
                  $ref: '#/components/schemas/Pose'
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/calibration/object:
    post:
      summary: 设置工件坐标系（等同 POST /api/robot/object_frame）
      tags: [标定]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, frame]
              properties:
                name:
                  type: string
                frame:
                  $ref: '#/components/schemas/Pose'
                pose:
                  $ref: '#/components/schemas/Pose'
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/calibration/run:
    post:
      summary: 执行标定计算
      deprecated: true
      description: 当前未实现，返回 code=1004
      tags: [标定]
      responses:
        '200':
          description: 未实现
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /api/calibration/result:
    get:
      summary: 获取标定结果
      deprecated: true
      description: 当前未实现，返回 code=1004
      tags: [标定]
      responses:
        '200':
          description: 未实现
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  # ==========================================================================
  # Lua 脚本
  # ==========================================================================
  /api/script/upload:
    post:
      summary: 上传并编译 Lua 脚本
      description: 脚本仅加载到内存，不写入文件系统；成功后进入 LOADED 状态
      tags: [Lua 脚本]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptUploadRequest'
      responses:
        '200':
          description: 上传结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/run:
    post:
      summary: 异步执行已加载的 Lua 脚本
      description: 立即返回；通过 status 接口查询进度
      tags: [Lua 脚本]
      responses:
        '200':
          description: 执行请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/pause:
    post:
      summary: 暂停 Lua 脚本
      tags: [Lua 脚本]
      responses:
        '200':
          description: 暂停结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/resume:
    post:
      summary: 继续 Lua 脚本
      tags: [Lua 脚本]
      responses:
        '200':
          description: 继续结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/stop:
    post:
      summary: 停止 Lua 脚本
      tags: [Lua 脚本]
      responses:
        '200':
          description: 停止结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/step:
    post:
      summary: 单步执行 Lua 脚本
      description: 执行至下一个有效行后暂停
      tags: [Lua 脚本]
      responses:
        '200':
          description: 单步结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/status:
    get:
      summary: 获取 Lua 脚本状态
      tags: [Lua 脚本]
      responses:
        '200':
          description: 当前脚本状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/breakpoint/add:
    post:
      summary: 添加断点
      tags: [Lua 脚本]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptBreakpointRequest'
      responses:
        '200':
          description: 添加结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/breakpoint/remove:
    post:
      summary: 删除断点
      tags: [Lua 脚本]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptBreakpointRequest'
      responses:
        '200':
          description: 删除结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

  /api/script/breakpoint/clear:
    post:
      summary: 清空所有断点
      tags: [Lua 脚本]
      responses:
        '200':
          description: 清空结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'

# ============================================================================
# Components / Schemas
# ============================================================================
components:
  schemas:
    StandardResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
        code:
          type: integer
          description: >
            业务状态码。0: 成功, 1xxx: 参数错误, 2xxx: 运动/规划错误,
            3xxx: 状态错误, 4xxx: 标定错误, 5xxx: 异步任务错误, -6xxx: Lua 错误
        message:
          type: string
        data:
          type: object
          nullable: true

    Pose:
      type: object
      properties:
        position:
          type: object
          properties:
            x: { type: number, default: 0 }
            'y': { type: number, default: 0 }
            z: { type: number, default: 0 }
        orientation:
          type: object
          properties:
            x: { type: number, default: 0 }
            'y': { type: number, default: 0 }
            z: { type: number, default: 0 }
            w: { type: number, default: 1 }

    RobotStateData:
      type: object
      properties:
        robot_state:
          type: string
          enum:
            [IDLE, ENABLING, DISABLING, STARTING, STOPPING, PAUSING, RESUMING,
             RESETTING, RUNNING, PAUSED, STOPPED, SERVOING, ERROR_STATE]
        is_enabled:     { type: boolean }
        is_running:     { type: boolean }
        control_active: { type: boolean }
        motion_busy:    { type: boolean }
        timestamp:      { type: number, description: "快照时刻 (epoch seconds)" }
        joint_states:
          type: array
          items:
            $ref: '#/components/schemas/JointState'
        flange:
          $ref: '#/components/schemas/Pose'
        active_tool_frame_name:
          type: string
        active_tool_frame:
          $ref: '#/components/schemas/Pose'
        active_object_frame_name:
          type: string
        active_object_frame:
          $ref: '#/components/schemas/Pose'
        hw_state:
          $ref: '#/components/schemas/HardwareState'

    JointState:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        position:    { type: number }
        velocity:    { type: number }
        torque:      { type: number }
        load_torque: { type: number }
        status:      { type: integer, description: "0: disabled, 1: fault, 2: enabled" }

    HardwareState:
      type: object
      properties:
        joint_num: { type: integer }
        state:     { type: integer, description: "0: DISABLED, 1: ENABLED, 2: ERROR" }

    RobotInfoData:
      type: object
      properties:
        joint_infos:
          type: array
          items:
            type: object
            properties:
              id:              { type: integer }
              name:            { type: string }
              cnt_per_unit:    { type: number }
              torque_per_unit: { type: number }
              ratio:           { type: number }
              unit_name:       { type: string }
              zero_offset:     { type: integer }

    RobotEnabledData:
      type: object
      properties:
        enabled:     { type: boolean }
        disabled:    { type: boolean }
        robot_state: { type: string }

    MotionResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                robot_state:    { type: string }
                control_active: { type: boolean }
                motion_busy:    { type: boolean, description: "WaitMove 专用" }

    MoveStatusData:
      type: object
      properties:
        robot_state:    { type: string }
        is_running:     { type: boolean }
        control_active: { type: boolean }
        task_id:        { type: string }
        task:
          type: object
          nullable: true

    FrameNameList:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
        active:
          type: string
          description: 当前激活的坐标系名称

    NamedFrame:
      type: object
      properties:
        name:
          type: string
        frame:
          $ref: '#/components/schemas/Pose'

    FramesSnapshot:
      type: object
      properties:
        path:
          type: string
        tool_frames:
          type: array
          items:
            type: string
        object_frames:
          type: array
          items:
            type: string
        active_tool_frame:
          type: string
        active_object_frame:
          type: string

    ScriptUploadRequest:
      type: object
      required: [filename, source]
      properties:
        filename:
          type: string
        source:
          type: string
          description: UTF-8 Lua 源码

    ScriptBreakpointRequest:
      type: object
      required: [filename, line]
      properties:
        filename: { type: string }
        line:     { type: integer, minimum: 1 }

    ScriptBreakpoint:
      type: object
      required: [filename, line]
      properties:
        filename: { type: string }
        line:     { type: integer, minimum: 1 }

    ScriptStatusData:
      type: object
      required: [state, script_id, filename, line, error, motion_active, breakpoints]
      properties:
        state:
          type: string
          enum: [EMPTY, LOADED, RUNNING, PAUSING, PAUSED, STOPPING, COMPLETED, FAILED, STOPPED]
        script_id:     { type: string }
        filename:      { type: string }
        line:          { type: integer, minimum: 0 }
        error:         { type: string }
        motion_active: { type: boolean }
        breakpoints:
          type: array
          items:
            $ref: '#/components/schemas/ScriptBreakpoint'

    ScriptResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ScriptStatusData'

  responses: {}
  securitySchemes: {}
servers: []
security: []
