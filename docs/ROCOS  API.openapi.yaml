components:
  schemas:
    StandardResponse:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          type: boolean
          description: 请求是否成功
        code:
          type: integer
          description: >-
            业务状态码。0: 成功, 1xxx: 参数错误, 2xxx: 运动规划错误, 3xxx: 状态错误, 4xxx: 标定错误, 5xxx:
            异步任务错误, -6xxx: Lua 脚本错误
        message:
          type: string
          description: 状态描述信息
        data:
          type: object
          description: 具体业务数据
          properties: {}
          nullable: true
    Pose:
      type: object
      properties:
        position:
          type: object
          properties:
            x:
              type: number
              default: 0
            'y':
              type: number
              default: 0
            z:
              type: number
              default: 0
        orientation:
          type: object
          properties:
            x:
              type: number
              default: 0
            'y':
              type: number
              default: 0
            z:
              type: number
              default: 0
            w:
              type: number
              default: 1
    NullableVector3:
      type: object
      properties:
        x:
          type: number
          default: 0
          nullable: true
        'y':
          type: number
          default: 0
          nullable: true
        z:
          type: number
          default: 0
          nullable: true
    CalibrationResultPose:
      type: object
      properties:
        position:
          $ref: '#/components/schemas/NullableVector3'
        orientation:
          type: object
          properties:
            x:
              type: number
              default: 0
            'y':
              type: number
              default: 0
            z:
              type: number
              default: 0
            w:
              type: number
              default: 1
    RobotEnabledData:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
    RobotInfoData:
      type: object
      properties:
        joint_infos:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Slave_1000[ SIM ]
              cnt_per_unit:
                type: number
                example: 156455.678
              torque_per_unit:
                type: number
                example: 1
              ratio:
                type: number
                example: 1
              unit_name:
                type: string
                example: rad
              zero_offset:
                type: integer
                example: 0
    RobotStateData:
      type: object
      properties:
        joint_states:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Slave_1000[ SIM ]
              position:
                type: number
                example: 0
              velocity:
                type: number
                example: 0
              torque:
                type: number
                example: 0
              load_torque:
                type: number
                example: 0
              status:
                type: integer
                description: '0: disabled, 1: fault, 2: enabled'
                example: 2
        flange:
          $ref: '#/components/schemas/Pose'
        tool:
          $ref: '#/components/schemas/Pose'
        object:
          $ref: '#/components/schemas/Pose'
        hw_state:
          type: object
          properties:
            hw_type:
              type: integer
              description: '1: simulation, 2: EtherCAT'
              example: 1
            current_cycle_time:
              type: number
              example: 1006.8407922546279
            min_cycle_time:
              type: number
              example: 990.153963721232
            max_cycle_time:
              type: number
              example: 1009.6510057264206
            slave_num:
              type: integer
              example: 20
    CalibrationResultData:
      type: object
      properties:
        error_state:
          type: boolean
          example: false
        pose:
          $ref: '#/components/schemas/CalibrationResultPose'
    TaskStatusData:
      type: object
      properties:
        task_id:
          type: string
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type:
          type: string
          example: MoveJ
        status:
          type: string
          enum:
            - RUNNING
            - COMPLETED
            - FAILED
            - STOPPED
          example: COMPLETED
        result:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        create_time:
          type: string
          format: date-time
          example: '2025-06-03T14:30:00Z'
        finish_time:
          type: string
          format: date-time
          example: '2025-06-03T14:30:02Z'
    ScriptUploadRequest:
      type: object
      required:
        - filename
        - source
      properties:
        filename:
          type: string
          description: 用于错误定位和断点匹配的逻辑文件名
          example: pick_and_place.lua
        source:
          type: string
          description: UTF-8 Lua source code
          example: "robot.Sleep(100)\n"
    ScriptBreakpointRequest:
      type: object
      required:
        - filename
        - line
      properties:
        filename:
          type: string
          example: pick_and_place.lua
        line:
          type: integer
          minimum: 1
          example: 12
    ScriptBreakpoint:
      type: object
      required:
        - filename
        - line
      properties:
        filename:
          type: string
        line:
          type: integer
          minimum: 1
    ScriptStatusData:
      type: object
      required:
        - state
        - script_id
        - filename
        - line
        - error
        - motion_active
        - breakpoints
      properties:
        state:
          type: string
          enum:
            - EMPTY
            - LOADED
            - RUNNING
            - PAUSING
            - PAUSED
            - STOPPING
            - COMPLETED
            - FAILED
            - STOPPED
        script_id:
          type: string
          example: script_1
        filename:
          type: string
          example: pick_and_place.lua
        line:
          type: integer
          minimum: 0
          example: 12
        error:
          type: string
          example: ''
        motion_active:
          type: boolean
          example: false
        breakpoints:
          type: array
          items:
            $ref: '#/components/schemas/ScriptBreakpoint'
    ScriptResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ScriptStatusData'
    MoveResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              oneOf:
                - type: object
                  description: 异步执行时 (asynchronous=true) 返回的数据
                  required:
                    - task_id
                  properties:
                    task_id:
                      type: string
                      example: task_1
                    status:
                      type: string
                      example: RUNNING
                    message:
                      type: string
                      example: task created
                - type: object
                  description: 同步执行时 (asynchronous=false) 返回的数据
                  properties:
                    result:
                      type: integer
                      example: 0
                    message:
                      type: string
                      example: ok
              type: 'null'
  responses: {}
  securitySchemes: {}
servers: []
security: []
