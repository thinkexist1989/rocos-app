openapi: 3.0.1
info:
  title: ROCOS  API
  description: 替代 gRPC 的 HTTP/JSON 机器人控制器接口，支持多语言、跨平台低门槛集成。
  version: 1.0.0
tags:
  - name: 机器人状态与信息
  - name: 基础控制
  - name: 空间运动控制 (Motion)
  - name: 单轴/多轴控制
  - name: 拖拽示教
  - name: 标定与坐标系
  - name: Lua 脚本
paths:
  /api/robot/state:
    get:
      summary: 获取机器人完整状态
      deprecated: false
      description: 包含关节状态、笛卡尔位姿（法兰、工具、工件）及硬件总线状态
      tags:
        - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功获取机器人状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotStateData'
          headers: {}
      security: []
  /api/robot/info:
    get:
      summary: 获取机器人信息
      deprecated: false
      description: 获取关节传动比、脉冲数、零点偏移等参数
      tags:
        - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotInfoData'
          headers: {}
      security: []
  /api/robot/urdf:
    get:
      summary: 获取机器人 URDF 模型结构
      deprecated: false
      description: ''
      tags:
        - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            text/xml:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/robot/urdf/mesh:
    get:
      summary: 获取连杆 3D Mesh 文件 (STL)
      deprecated: false
      description: ''
      tags:
        - 机器人状态与信息
      parameters:
        - name: path
          in: query
          description: 'STL文件的相对路径，例如: link1.stl'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 二进制文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers: {}
      security: []
  /api/robot/enabled:
    get:
      summary: 查询使能状态
      deprecated: false
      description: ''
      tags:
        - 基础控制
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RobotEnabledData'
          headers: {}
      security: []
  /api/robot/enable:
    post:
      summary: 全局使能机器人
      deprecated: false
      description: ''
      tags:
        - 基础控制
      parameters: []
      responses:
        '200':
          description: 使能成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/robot/disable:
    post:
      summary: 全局下电/关闭使能
      deprecated: false
      description: ''
      tags:
        - 基础控制
      parameters: []
      responses:
        '200':
          description: 禁用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/robot/workmode:
    post:
      summary: 设置工作模式
      deprecated: false
      description: ''
      tags:
        - 基础控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - position
                    - ee_admit_teach
                    - jnt_admit_teach
                    - jnt_imp
                    - cart_imp
        required: true
      responses:
        '200':
          description: 模式切换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/move/joint:
    post:
      summary: 关节空间运动 (MoveJ)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - joints
              properties:
                joints:
                  type: array
                  items:
                    type: number
                  description: 目标关节角度（弧度）数组
                speed:
                  type: number
                  default: 1.05
                acceleration:
                  type: number
                  default: 1.4
                time:
                  type: number
                  default: 0
                radius:
                  type: number
                  default: 0
                asynchronous:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 运动请求已受理 (返回 data 视 asynchronous 参数而定)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
          headers: {}
      security: []
  /api/move/joint_ik:
    post:
      summary: 笛卡尔位姿逆解运动 (MoveJ_IK)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - pose
              properties:
                pose:
                  $ref: '#/components/schemas/Pose'
                speed:
                  type: number
                  default: 1.05
                acceleration:
                  type: number
                  default: 1.4
                time:
                  type: number
                  default: 0
                radius:
                  type: number
                  default: 0
                asynchronous:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
          headers: {}
      security: []
  /api/move/linear:
    post:
      summary: 笛卡尔直线运动 (MoveL)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - pose
              properties:
                pose:
                  $ref: '#/components/schemas/Pose'
                speed:
                  type: number
                  default: 1.05
                acceleration:
                  type: number
                  default: 1.4
                time:
                  type: number
                  default: 0
                radius:
                  type: number
                  default: 0
                asynchronous:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
          headers: {}
      security: []
  /api/move/linear_fk:
    post:
      summary: 关节空间直线运动 (MoveL_FK)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - joints
              properties:
                joints:
                  type: array
                  items:
                    type: number
                speed:
                  type: number
                  default: 1.05
                acceleration:
                  type: number
                  default: 1.4
                time:
                  type: number
                  default: 0
                radius:
                  type: number
                  default: 0
                asynchronous:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
          headers: {}
      security: []
  /api/move/circle:
    post:
      summary: 笛卡尔圆弧运动 (MoveC)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - pose_via
                - pose_to
              properties:
                pose_via:
                  $ref: '#/components/schemas/Pose'
                pose_to:
                  $ref: '#/components/schemas/Pose'
                speed:
                  type: number
                  default: 0.25
                acceleration:
                  type: number
                  default: 1.2
                time:
                  type: number
                  default: 0
                radius:
                  type: number
                  default: 0
                mode:
                  type: string
                  enum:
                    - UNCONSTRAINED
                    - FIXED
                  default: UNCONSTRAINED
                asynchronous:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
          headers: {}
      security: []
  /api/move/path:
    post:
      summary: 路径点运动 (MoveP)
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - pose
              properties:
                pose:
                  $ref: '#/components/schemas/Pose'
                speed:
                  type: number
                  default: 1.05
                acceleration:
                  type: number
                  default: 1.4
                time:
                  type: number
                  default: 0
                radius:
                  type: number
                  default: 0
                asynchronous:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
          headers: {}
      security: []
  /api/move/pathway:
    post:
      summary: 多路点路径运动 (MovePath)
      deprecated: false
      description: >-
        Not Implemented in the current server implementation. See server docs
        and implementation for details.
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - waypoints
              properties:
                waypoints:
                  type: array
                  items:
                    type: object
                    properties: {}
                asynchronous:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
          headers: {}
        '501':
          description: Not Implemented in server implementation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
      x-not-implemented: true
  /api/move/stop:
    post:
      summary: 停止运动
      deprecated: false
      description: ''
      tags:
        - 空间运动控制 (Motion)
      parameters: []
      responses:
        '200':
          description: 成功停止
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/move/status:
    get:
      summary: 查询异步任务状态
      deprecated: false
      description: 供上层任务编排系统进行状态追踪和错误恢复
      tags:
        - 空间运动控制 (Motion)
      parameters:
        - name: task_id
          in: query
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 返回任务详情状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskStatusData'
          headers: {}
      security: []
  /api/axis/single/enable:
    post:
      summary: 单轴使能
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  description: 关节序号(从0开始)
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/single/disable:
    post:
      summary: 单轴禁用
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/single/move:
    post:
      summary: 单轴运动
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - pos
              properties:
                id:
                  type: integer
                pos:
                  type: number
                  description: 目标位置
                max_vel:
                  type: number
                  default: -1
                max_acc:
                  type: number
                  default: -1
                max_jerk:
                  type: number
                  default: -1
                least_time:
                  type: number
                  default: -1
                raw_data:
                  type: boolean
                  default: false
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/single/stop:
    post:
      summary: 单轴停止
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/multi/enable:
    post:
      summary: 多轴统一使能
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/multi/disable:
    post:
      summary: 多轴统一下电
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/multi/move:
    post:
      summary: 多轴底层控制运动
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - target_pos
                - max_vel
                - max_acc
                - max_jerk
              properties:
                target_pos:
                  type: array
                  items:
                    type: number
                max_vel:
                  type: array
                  items:
                    type: number
                max_acc:
                  type: array
                  items:
                    type: number
                max_jerk:
                  type: array
                  items:
                    type: number
                least_time:
                  type: number
                  default: -1
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/multi/stop:
    post:
      summary: 多轴统一停止
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/axis/multi/sync:
    post:
      summary: 设置多轴同步模式
      deprecated: false
      description: ''
      tags:
        - 单轴/多轴控制
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - sync
              properties:
                sync:
                  type: string
                  enum:
                    - none
                    - time
                    - phase
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/drag/start:
    post:
      summary: 启动拖拽示教
      deprecated: false
      description: ''
      tags:
        - 拖拽示教
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - flag
                - direction
              properties:
                flag:
                  type: string
                  enum:
                    - J0
                    - J1
                    - J2
                    - J3
                    - J4
                    - J5
                    - J6
                    - TOOL_X
                    - TOOL_Y
                    - TOOL_Z
                    - TOOL_ROLL
                    - TOOL_PITCH
                    - TOOL_YAW
                    - FLANGE_X
                    - FLANGE_Y
                    - FLANGE_Z
                    - FLANGE_ROLL
                    - FLANGE_PITCH
                    - FLANGE_YAW
                    - OBJECT_X
                    - OBJECT_Y
                    - OBJECT_Z
                    - OBJECT_ROLL
                    - OBJECT_PITCH
                    - OBJECT_YAW
                    - BASE_X
                    - BASE_Y
                    - BASE_Z
                    - BASE_ROLL
                    - BASE_PITCH
                    - BASE_YAW
                    - NULLSPACE
                direction:
                  type: string
                  enum:
                    - POSITIVE
                    - NEGATIVE
                    - NONE
                max_speed:
                  type: number
                  default: 1
                max_acceleration:
                  type: number
                  default: 2
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/drag/stop:
    post:
      summary: 停止拖拽示教
      deprecated: false
      description: ''
      tags:
        - 拖拽示教
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
          headers: {}
      security: []
  /api/script/upload:
    post:
      summary: 上传并编译 Lua 脚本
      deprecated: false
      description: 脚本仅加载到内存，不写入服务器文件系统；成功后进入 LOADED 状态。
      tags:
        - Lua 脚本
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptUploadRequest'
      responses:
        '200':
          description: 上传成功或返回脚本编译/状态错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
  /api/script/run:
    post:
      summary: 异步执行已加载的 Lua 脚本
      deprecated: false
      description: 立即返回；通过脚本状态接口查询执行进度与结果。
      tags:
        - Lua 脚本
      parameters: []
      responses:
        '200':
          description: 执行请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
  /api/script/pause:
    post:
      summary: 暂停 Lua 脚本
      deprecated: false
      description: 脚本正在执行运动时，同时请求暂停机器人运动。
      tags:
        - Lua 脚本
      parameters: []
      responses:
        '200':
          description: 暂停请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
  /api/script/resume:
    post:
      summary: 继续 Lua 脚本
      deprecated: false
      description: 脚本包含暂停中的运动时，同时继续机器人运动。
      tags:
        - Lua 脚本
      parameters: []
      responses:
        '200':
          description: 继续请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
  /api/script/stop:
    post:
      summary: 停止 Lua 脚本
      deprecated: false
      description: 安全停止脚本及其活动机器人运动。
      tags:
        - Lua 脚本
      parameters: []
      responses:
        '200':
          description: 停止请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
  /api/script/step:
    post:
      summary: 单步执行 Lua 脚本
      deprecated: false
      description: 执行至下一个有效 Lua source line 后暂停。
      tags:
        - Lua 脚本
      parameters: []
      responses:
        '200':
          description: 单步请求结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
  /api/script/status:
    get:
      summary: 获取 Lua 脚本状态
      deprecated: false
      description: 返回当前脚本、source location、运行错误、运动状态和断点列表。
      tags:
        - Lua 脚本
      parameters: []
      responses:
        '200':
          description: 当前脚本状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
  /api/script/breakpoint/add:
    post:
      summary: 添加 Lua 脚本断点
      deprecated: false
      description: ''
      tags:
        - Lua 脚本
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptBreakpointRequest'
      responses:
        '200':
          description: 添加结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptResponse'
      security: []
