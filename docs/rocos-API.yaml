  /api/robot/movec:
    post:
      summary: 笛卡尔圆弧运动 (MoveC)
      deprecated: false
      description: |
        支持两种模式：圆心+角度 (center_frame + theta) 或三点圆弧 (pose_via + pose_goal)。 pose_start 可选，默认当前法兰位姿。
      tags:
      - 空间运动控制 (Motion)
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pose_start:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧起点，默认当前法兰位姿
                center_frame:
                  $ref: '#/components/schemas/Pose'
                  description: 圆心位姿（与 theta 配合）
                theta:
                  type: number
                  description: 圆弧角度 [rad]（与 center_frame 配合）
                pose_via:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧经过点（与 pose_goal 配合）
                pose_goal:
                  $ref: '#/components/schemas/Pose'
                  description: 圆弧终点（与 pose_via 配合）
                pose_to:
                  $ref: '#/components/schemas/Pose'
                  description: pose_goal 的别名
                velocity:
                  type: number
                  default: 1
                acceleration:
                  type: number
                  default: 2
                jerk:
                  type: number
                  default: 10
        required: true
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
