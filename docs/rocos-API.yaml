          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                max_error:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 0.05
                  default: 0.001
                  description: P1–P4 固定参考点最大残差阈值，m
                  minimum: 0
              required:
              - session_id
        required: true
      responses:
        '200':
          description: HTTP 200，检查 success/code；失败时 data 可为空
