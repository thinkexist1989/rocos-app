  /api/calibration/run:
    post:
      summary: 计算六点法工具坐标系（不自动保存或激活）
      deprecated: false
      description: 写操作需要 X-Rocos-Control-Token 与 X-Rocos-Client-Id 同时存在，且状态为 IDLE/STOPPED；检查、文件提交与生效同运动启动互斥。code=1001
        参数无效，4005 状态不允许；其他文件和注册表错误沿用 Result 错误码。 要求创建者令牌和完整六点（4001）。固定枢轴 SVD 求 TCP，拒绝秩亏/病态姿态和超限残差（4002）。P5/P6
        方向相对 P4 不超过 1°，位移至少 1 mm，X/Z 夹角正弦至少 sin(10°)。X=P5−P4，以 P6−P4 确定 XZ 平面，叉积构造右手正交工具系。返回法兰到 TCP 的
        pose 和残差/条件数；计算不创建、不保存也不激活工具，应另行 POST tool_frame persist=true 并明确激活。每次计算前清空旧 result，失败后不会保留旧解；会话失效/归属错误
        4004。 包工具会话固定摘要与安装 revision，变更后返回 4004，须重启采集；保存包工具必须使用 POST /api/calibration/save，由服务端反算局部 TCP。
