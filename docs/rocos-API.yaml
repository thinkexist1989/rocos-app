  /api/logs:
    get:
      summary: 查询控制器最近的警告与错误日志
      deprecated: false
      description: |-
        独立诊断服务，默认 `http://控制器地址:8082`，端口由启动配置 `diagnostics.port` 指定。无需控制权或身份头，不会续期控制权。支持跨域 GET/OPTIONS；开发时应将 `/api/logs` 及其子路径代理到诊断端口。

        查询当前 App 进程的内存缓存，只包含 warn/error/critical，不读取磁盘文件，普通 info 请使用最新文件接口。缓存上限为 4096 帧或约 16 MiB，先到者触发淘汰；重启后旧进程记录不保留。

        不传 after 时取最近 limit 条，按旧到新返回；传 after 时返回该游标之后的记录。limit 默认 100，范围 1–500。has_more=true 时可继续以 next_id 分页；随后用 next_id 订阅实时流，客户端按 id 去重。旧会话游标会返回 gap.reason=server_restarted；缓存覆盖为 buffer_overrun；生产队列丢失为 producer_overflow。游标格式错误、超过 128 字符、同会话游标超前、limit 非整数或越界均为 HTTP 400。
      tags:
      - 日志与诊断
      parameters:
      - name: after
        in: query
        description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
        required: false
        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      - name: limit
        in: query
        description: 最大日志条数。
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: 查询成功，JSON 封装。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerLogQueryResponse'
              example:
                success: true
                code: 0
                message: ok
                data:
                  events:
                  - id: a1b2c3-1234:1
                    timestamp: '2026-10-23T17:10:16.001+08:00'
                    level: warn
                    module: Hardware
                    code: -2310
                    message: Joint 1 velocity exceeded the limit.
                  next_id: a1b2c3-1234:1
                  has_more: false
                  gap: null
          headers: {}
        '400':
          description: 参数或游标不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: 1001
                message: limit must be in [1, 500]
                data: null
          headers: {}
        '503':
          description: 诊断服务正在停止。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Diagnostics service is stopping
                data: null
          headers: {}
      security: []
  /api/logs/stream:
    get:
      summary: 实时订阅控制器日志（SSE）
      deprecated: false
      description: |-
        独立诊断服务，默认 `http://控制器地址:8082`，端口由启动配置 `diagnostics.port` 指定。无需控制权或身份头，不会续期控制权。支持跨域 GET/OPTIONS；开发时应将 `/api/logs` 及其子路径代理到诊断端口。

        成功响应是长期保持的 text/event-stream 文本流，不是 JSON 响应封装。仅推送 warn/error/critical 和缺口通知。

        不传游标只订阅后续记录；提供 after 或 Last-Event-ID 会先重放尚在缓存内的后续帧，再推送新记录。Last-Event-ID 头存在时优先于 after 查询参数，包括显式空头。使用原生 EventSource 自动重连时浏览器会发送 Last-Event-ID。

        `event: log` 的 data 为 ControllerLogEvent JSON，并带 id 字段；`event: gap` 的 data 为 ControllerLogGap JSON，无事件 id。重启、缓存淘汰、生产端溢出和慢客户端覆盖会产生 gap；客户端需提示可能丢失日志，并按日志 id 去重。连接开始发送 `: connected` 注释，空闲约 15 秒发送 `: heartbeat`。

        默认最多同时 4 个 SSE 客户端，可由 diagnostics.max_sse_clients 配置（1–64）；超额返回 429 和 Retry-After: 5。响应头 X-Rocos-SSE-Limit 给出配置的上限；代理需关闭缓冲并允许长连接。响应开始前参数错误为 400，停止中为 503；开始后故障通过断开连接体现。
      tags:
      - 日志与诊断
      parameters:
      - name: after
        in: query
        description: 续传游标，Last-Event-ID 头优先。
        required: false
        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      - name: Last-Event-ID
        in: header
        description: 原生 SSE 重连游标，优先于 after；最多 128 字符。
        required: false
        example: ''
        schema:
          type: string
          maxLength: 128
          pattern: ^([A-Za-z0-9-]+:[0-9]+)?$
          description: 不透明游标 session:sequence；使用上次返回的 next_id 或 SSE id，不要自行拼接。
      responses:
        '200':
          description: SSE 流，log/gap 命名事件的 data 为 JSON。
          content:
            text/event-stream:
              schema:
                type: string
              example: |+
                : connected

                id: a1b2c3-1234:1
                event: log
                data: {"id": "a1b2c3-1234:1", "timestamp": "2026-10-23T17:10:16.001+08:00", "level": "warn", "module": "Hardware", "code": -2310, "message": "Joint 1 velocity exceeded the limit."}

                event: gap
                data: {"reason":"buffer_overrun","earliest_id":"a1b2c3-1234:2"}

                : heartbeat

          headers:
            X-Rocos-SSE-Limit:
              required: false
              description: 当前配置的 SSE 连接上限。
              schema:
                type: integer
                example: 4
            Cache-Control:
              required: false
              description: ''
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              required: false
              description: ''
              schema:
                type: string
                example: 'no'
        '400':
          description: 游标不合法。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: 1001
                message: Invalid log cursor
                data: null
          headers: {}
        '429':
          description: SSE 连接配额已满。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: SSE connection limit reached
                data: null
          headers:
            Retry-After:
              required: false
              description: 建议等待秒数，当前为 5。
              schema:
                type: integer
                example: 5
        '503':
          description: 诊断服务正在停止。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Diagnostics service is stopping
                data: null
          headers: {}
      security: []
  /api/logs/file/latest:
    get:
      summary: 下载控制器当前日志文件的快照
      deprecated: false
      description: |-
        独立诊断服务，默认 `http://控制器地址:8082`，端口由启动配置 `diagnostics.port` 指定。无需控制权或身份头，不会续期控制权。支持跨域 GET/OPTIONS；开发时应将 `/api/logs` 及其子路径代理到诊断端口。

        返回当前正在写入的日志文件的固定快照，成功正文为 text/plain; charset=utf-8 原始文本，不是 JSON；失败时才返回 JSON 封装。不合并轮转历史文件，也不接受客户端文件路径。文件可含 info 以及 logging.file_level 允许的其他级别。

        文件每行格式 `[YYYY-MM-DD HH:mm:ss.SSS] [Module] [level] message`，保留文本空格和换行，不包含控制台 ANSI 颜色转义。浏览器预览可仅对 [level] 着色；下载应保留原始文件内容。

        文件线程先 flush，再取得文件句柄与固定字节长度；X-Rocos-Log-Snapshot-Time 表示快照时间。快照之后追加的日志不属于本次下载，刷新会重新取快照。Content-Disposition 提供服务端文件名。允许空文件快照。

        默认最多 1 个同时下载，可由 diagnostics.max_downloads 配置（1–16）；超额 429，Retry-After: 5。文件快照请求等待默认 250 ms，超时或存储不可用为 503，无可用文件为 404，正文开始前读取失败为 500；发送开始后的错误仅表现为连接中断。
      tags:
      - 日志与诊断
      parameters: []
      responses:
        '200':
          description: 原始日志文件，可作为文件下载或文本预览。
          content:
            text/plain:
              schema:
                type: string
              example: |
                [2026-10-23 17:10:15.969] [Hardware] [info] Parsed drive: id=0, joint=joint_1
          headers:
            Content-Disposition:
              required: false
              description: attachment; filename="rocos-app_....log"
              schema:
                type: string
            X-Rocos-Log-Snapshot-Time:
              required: false
              description: 带时区偏移的快照时间。
              schema:
                type: string
                format: date-time
            Cache-Control:
              required: false
              description: ''
              schema:
                type: string
                example: no-store
        '404':
          description: 没有可用的当前文件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Log file snapshot is unavailable
                data: null
          headers: {}
        '429':
          description: 文件下载连接配额已满。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Download connection limit reached
                data: null
          headers:
            Retry-After:
              required: false
              description: 建议等待秒数，当前为 5。
              schema:
                type: integer
                example: 5
        '500':
          description: 正文开始前读取快照失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Cannot read log file snapshot
                data: null
          headers: {}
        '503':
          description: 诊断服务停止中，或快照超时/存储不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticsErrorResponse'
              example:
                success: false
                code: -3001
                message: Log file snapshot is unavailable
                data: null
          headers: {}
      security: []
  /api/robot/load_params:
    get:
      summary: 获取当前负载参数
      deprecated: false
      description: |-
        控制服务接口，默认端口 8080。质量单位 kg，质心单位 m，质心在法兰坐标系表达。

        无需控制权；只读请求不续期。返回 valid、mass 和 com。valid=false 表示尚无有效参数，不能仅凭数值判断辨识已完成。读取当前内存参数，不读取指定文件。
      tags:
      - 负载参数
      parameters: []
      responses:
        '200':
          description: 当前负载参数。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadParametersResponse'
              example:
                success: true
                code: 0
                message: ok
                data:
                  valid: true
                  mass: 2.5
                  com:
                  - 0
                  - 0
                  - 0.08
          headers: {}
      security: []
    post:
      summary: 设置当前负载参数
      deprecated: false
      description: |-
        控制服务接口，默认端口 8080。质量单位 kg，质心单位 m，质心在法兰坐标系表达。

        必须同时携带 `X-Rocos-Control-Token` 和与持有者匹配的 `X-Rocos-Client-Id`（AND）。缺令牌返回业务码 3006；错误、过期或客户端身份不匹配返回 3007。通过鉴权的请求续期。业务失败仍以 HTTP 200 返回，请检查 success/code；不会以 HTTP 401 替代该约定。

        mass 必填，有限且非负；mass=0 表示无负载。com 可选，默认 [0,0,0]，必须恰好 3 个有限数值。设置后 valid=true，仅更新内存；需要持久化时另调 POST /api/robot/load_params/save。

        参数类型/形状或 JSON 不合法：业务码 1001；负质量或非有限值：-2902（ParameterNanOrInf）；成功为 0。
      tags:
      - 负载参数
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mass:
                  type: number
                  minimum: 0
                  description: 负载质量，单位 kg，必须有限；0 表示无负载。
                com:
                  type: array
                  minItems: 3
                  maxItems: 3
                  items:
                    type: number
                  description: 法兰坐标系下的质心 [x,y,z]，单位 m，各分量必须有限。
                  default:
                  - 0
                  - 0
                  - 0
              required:
              - mass
            example:
              mass: 2.5
              com:
              - 0
              - 0
              - 0.08
        required: true
      responses:
        '200':
          description: 成功或业务错误（包括控制权拒绝），均为 HTTP 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetLoadParametersResponse'
              example:
                success: true
                code: 0
                message: Load parameters set
                data:
                  mass: 2.5
                  com:
                  - 0
                  - 0
                  - 0.08
          headers: {}
      security:
      - ControlToken: []
        ClientId: []
  /api/robot/load_params/save:
    post:
      summary: 将当前负载参数保存为 YAML 文件
      deprecated: false
      description: |-
        控制服务接口，默认端口 8080。质量单位 kg，质心单位 m，质心在法兰坐标系表达。

        必须同时携带 `X-Rocos-Control-Token` 和与持有者匹配的 `X-Rocos-Client-Id`（AND）。缺令牌返回业务码 3006；错误、过期或客户端身份不匹配返回 3007。通过鉴权的请求续期。业务失败仍以 HTTP 200 返回，请检查 success/code；不会以 HTTP 401 替代该约定。

        将当前已设置或已辨识的负载参数写入控制器端 YAML，保存 mass 与 com。path 可选，省略或为空时使用启动配置 robot.payload 对应的默认路径，响应 data.path 为实际路径。路径属于控制器文件系统。空请求体可使用默认路径；当前实现对非法 JSON 或非字符串 path 也回退默认路径，而非返回参数错误。

        没有有效参数、不能打开目标文件或写入失败时业务码 -3001（ResourceUnavailable）；成功为 0。调用不会自动创建缺失的父目录。
      tags:
      - 负载参数
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: 控制器端目标 YAML 路径；省略/空串使用启动配置的默认负载文件。
            example: {}
      responses:
        '200':
          description: 成功或业务错误，均为 HTTP 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveLoadParametersResponse'
              example:
                success: true
                code: 0
                message: Load parameters saved
                data:
                  path: /path/to/config/payload.yaml
          headers: {}
      security:
      - ControlToken: []
        ClientId: []
webhooks: {}
components:
  schemas:
    RobotStateData:
      type: object
      properties:
        robot_state:
          type: string
          enum:
          - IDLE
          - ENABLING
          - DISABLING
          - STARTING
          - STOPPING
          - PAUSING
          - RESUMING
          - RESETTING
          - RUNNING
          - PAUSED
          - STOPPED
          - SERVOING
          - ERROR_STATE
        work_mode:
          type: string
          enum:
          - position
          - ee_admit_teach
          - jnt_admit_teach
          - jnt_imp
          - cart_imp
          description: 当前工作模式
        is_enabled:
          type: boolean
        is_running:
          type: boolean
        control_active:
          type: boolean
        motion_busy:
          type: boolean
        timestamp:
          type: number
          description: 快照时刻 (epoch seconds)
        joint_states:
          type: array
          items:
            $ref: '#/components/schemas/JointState'
        flange:
          $ref: '#/components/schemas/Pose'
          description: 基座到法兰的实时位姿，保持原语义，不叠加工具偏置。
        active_tool_frame_name:
          type: string
        active_tool_frame:
          $ref: '#/components/schemas/Pose'
          description: 法兰到当前工具的固定偏置；不是基座到 TCP 的实时位姿。
        active_object_frame_name:
          type: string
        active_object_frame:
          $ref: '#/components/schemas/Pose'
        hw_state:
          $ref: '#/components/schemas/HardwareState'
        tcp:
          oneOf:
          - $ref: '#/components/schemas/Pose'
            description: 基座到当前 TCP 的实时位姿，使用与 flange 相同的关节采样及同一工具注册表快照；无活动工具时等于 flange，FK/反馈无效时为 null。缺少此字段表示旧版
              App。
          - type: 'null'
        active_tool_package:
          oneOf:
          - $ref: '#/components/schemas/ToolPackageData'
            description: 当前包工具的摘要、版本、安装 M、局部 TCP C、revision 和 URDF 路径，与 tcp 使用同一注册表快照；普通工具或无工具为 null。省略
              default_mount/default_tcp 和 calibration_yaml。模型为 flange*M，实时 TCP 为 flange*M*C。旧 App 缺省此字段。
          - type: 'null'
    NamedFrame:
      type: object
      properties:
        name:
          type: string
        frame:
          $ref: '#/components/schemas/Pose'
        package:
          $ref: '#/components/schemas/ToolPackageData'
    ControllerLogQueryData:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ControllerLogEvent'
          description: 按事件序号从旧到新排列。
        next_id:
          type: string
          description: 后续查询或 SSE 续传使用的游标；空 events 也返回。
        has_more:
          type: boolean
          description: 仍有后续缓存记录时为 true；继续以 next_id 查询。
        gap:
          oneOf:
          - $ref: '#/components/schemas/ControllerLogGap'
            description: 重启、覆盖或生产端丢失提示；无缺口时为 null。
          - type: 'null'
      required:
      - events
      - next_id
      - has_more
      - gap
    ToolRegistryListData:
      type: object
      properties:
