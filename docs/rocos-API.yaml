      summary: 启动 UDP 伺服运动模式
      deprecated: false
      description: |
        进入 SERVOING 状态，在 localhost 上启动 UDP 伺服线程。 机器人开始监听指定端口，接收外部 MotionGeneratorCommand 并回复 RobotState。
      tags:
