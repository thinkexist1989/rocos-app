      - library_path
      - robot_id
  responses: {}
  securitySchemes:
    ControlToken:
      type: apiKey
      in: header
      name: X-Rocos-Control-Token
      description: 单持有者控制权令牌，由 acquire/takeover 获取。写接口和 heartbeat 必须同时携带 X-Rocos-Control-Token 与匹配的 X-Rocos-Client-Id；缺
        token 返回 3006，错误、过期或身份不匹配返回 3007。通过鉴权的写请求与心跳续期；GET 不续期。
    ClientId:
      type: apiKey
      in: header
      name: X-Rocos-Client-Id
      description: 与申请控制权时绑定的 client_id 一致；和 ControlToken 必须同时提供。
servers: []
security: []
