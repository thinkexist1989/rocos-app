          type: string
          pattern: ^[0-9a-f]{64}$
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740990
        urdf:
          type: string
          description: 包内 URDF 路径，可为空；资源通过 name+digest+path 查询
