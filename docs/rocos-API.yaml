                  - FLANGE_YAW
                  - OBJECT_X
                  - OBJECT_Y
                  - OBJECT_Z
                  - OBJECT_ROLL
                  - OBJECT_PITCH
                  - OBJECT_YAW
                  - BASE_X
                  - BASE_Y
                  - BASE_Z
