# 来源：Apifox MCP「ROCOS API」，在线 OpenAPI 为权威来源。
# 同步时间：2026-10-24 15:16:42 +08:00（服务器下载时间见 info.x-download-time）。
# MCP 分拆的外部引用已合并至本文件；内部 $ref 保留。
openapi: 3.1.0
info:
  title: ROCOS API
  description: 机器人控制器 HTTP/JSON 接口，替代 gRPC，支持多语言跨平台集成。
  version: 3.0.0
  x-download-time: '2026-10-24T07:16:42.461Z'
paths:
  /api/robot/state:
    get:
      summary: 获取机器人完整状态快照
      deprecated: false
      description: 包含 FSM 状态、关节数据、法兰位姿、实时 TCP、当前工具固定偏置、工件系及硬件摘要。tcp 为基座到当前 TCP，与 flange 使用同一关节采样并与活动工具使用同一注册表快照；无活动工具时
        tcp=flange，FK/反馈无效时 tcp=null。flange 继续表示基座到法兰，active_tool_frame 继续表示法兰到工具的固定偏置。只读、不要求控制权、不续期。
        active_tool_package 为当前工具包安装与模型元信息（普通工具为 null），模型使用 flange*mount，tcp 使用 flange*mount*局部tcp；三者来自同一注册表快照。
      tags:
      - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RobotStateData'
          headers: {}
      security: []
  /api/robot/info:
    get:
      summary: 获取机器人参数信息
      deprecated: false
      description: 返回各关节的传动比、编码器脉冲数、零点偏移等配置参数
      tags:
      - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RobotInfoData'
          headers: {}
      security: []
  /api/robot/urdf:
    get:
      summary: 获取机器人 URDF 模型 XML
      deprecated: false
      description: ''
      tags:
      - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 返回 URDF XML 文本
          content:
            text/xml:
              schema:
                type: string
          headers: {}
      security: []
  /api/robot/urdf/mesh:
    get:
      summary: 获取连杆 3D Mesh 文件 (STL)
      deprecated: false
      description: ''
      tags:
      - 机器人状态与信息
      parameters:
      - name: path
        in: query
        description: STL 文件相对路径，支持 package:// 格式
        required: true
        example: ''
        schema:
          type: string
      responses:
        '200':
          description: 二进制文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers: {}
      security: []
  /api/robot/impedance:
    get:
      summary: 获取当前阻抗控制参数（关节空间 + 笛卡尔空间）
      deprecated: false
      description: |
        返回当前工作模式下的阻抗参数（刚度与阻尼）。
        - 关节阻抗模式 (jnt_imp): 返回每关节的刚度 [Nm/rad] 和阻尼 [Nm·s/rad]
        - 笛卡尔阻抗模式 (cart_imp): 返回平动/转动刚度 [N/m, Nm/rad] 和阻尼 [N·s/m, Nm·s/rad]
        - 其他模式: joint_space.valid 和 cartesian_space.valid 均为 false
      tags:
      - 机器人状态与信息
      parameters: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ImpedanceData'
          headers: {}
      security: []
  /api/robot/tcp:
    get:
      summary: 查询当前或指定工具的实时 TCP 位姿
      deprecated: false
      description: 返回基座到 TCP 的实时位姿：T_base_tcp = T_base_flange × T_flange_tool。name 省略/为空时使用当前激活工具；无活动工具时默认返回法兰位姿。指定工具只影响本次读取，不切换活动工具、不写文件、不执行运动。运动中也允许只读查询；GET
        不要求控制凭据、不续期。名称非法返回 code=1001，工具不存在或资源不可用返回 -3001，FK/反馈无效返回 -2350；失败时 success=false、data=null，不伪造有效单位位姿。
      tags:
      - 机器人状态与信息
      parameters:
      - name: name
        in: query
        description: 指定工具名，省略或空字符串使用当前工具；只读查询不会改变激活工具
        required: false
        example: tool1
        schema:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9_.-]*$
      responses:
        '200':
          description: HTTP 200，检查 success 和 code；成功返回实时 TCP，失败 data 为 null
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/StandardResponse'
                - type: object
                  properties:
                    data:
                      anyOf:
                      - $ref: '#/components/schemas/TcpPoseData'
                      - type: 'null'
          headers: {}
      security: []
  /api/robot/stiffness:
    post:
      summary: 设置机器人刚度系数
      deprecated: false
      description: 动态设置指定关节或笛卡尔空间方向的刚度（Stiffness）系数。用于在线调整阻抗/导纳控制器的刚性，以适配不同接触环境或任务阶段。
      tags: []
      parameters:
      - name: id
        in: query
        description: 目标标识。关节模式时为关节索引（如 "joint_1" 或 0）；笛卡尔模式时为坐标轴标识（如 "x", "y", "z", "rx", "ry", "rz"）
        required: false
        schema:
          type: string
      - name: stiffness
        in: query
        description: 刚度系数，单位 N/m（平移）或 N·m/rad（旋转）。必须 ≥ 0。0 表示完全柔顺（零刚度），值越大刚性越强。
        required: false
        schema:
          type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - ControlToken: []
        ClientId: []
  /api/robot/damping:
    post:
      summary: 设置机器人阻尼系数
      deprecated: false
      description: 动态设置指定关节或笛卡尔空间方向的刚度（Stiffness）系数。用于在线调整阻抗/导纳控制器的刚性，以适配不同接触环境或任务阶段。
      tags: []
      parameters:
      - name: id
        in: query
        description: 目标标识。关节模式时为关节索引（如 "joint_1" 或 0）；笛卡尔模式时为坐标轴标识（如 "x", "y", "z", "rx", "ry", "rz"）
        required: false
        schema:
          type: string
      - name: stiffness
        in: query
        description: 阻尼系数，单位 N·s/m 或 N·m·s/rad。临界阻尼自动计算：D = 2√(M·K)
        required: false
        schema:
          type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security:
      - ControlToken: []
        ClientId: []
