          description: 申请控制权时的源端口，仅供审计，不用于身份校验
        owner_connection:
          type: string
          description: 申请时的 remote_addr:remote_port，仅供审计，不绑定 TCP 连接
        owner_client_id:
          type: string
          description: 稳定客户端会话 ID；浏览器端口变更时仍可保证同一前端会话继续持有 token
        owner_name:
          type: string
        owner_agent:
          type: string
          description: 客户端 User-Agent
        held_for_seconds:
          type: integer
          description: 自 acquire 起已持有的秒数
        idle_seconds:
          type: integer
          description: 自上次续期起的空闲秒数
        expires_in_seconds:
          type: integer
          description: 距离 TTL 到期的剩余秒数
        ttl_seconds:
          type: integer
          minimum: 1
          description: 控制权超时秒数，默认 300，http_control_ttl_seconds 必须为正整数；通过鉴权的写请求与心跳续期
        heartbeat_interval_seconds:
          type: number
          description: 建议心跳间隔，默认 5 秒；短 TTL 时不超过 TTL/3
        client_id:
          type: string
          description: 绑定的客户端身份，acquire/takeover 返回；后续写请求和心跳须通过请求头回传
        client_id_auto:
