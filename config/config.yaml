# ROCOS-App 启动配置；所有相对路径均相对于本文件所在目录。
http_host: "0.0.0.0"
http_port: 8080
http_control_ttl_seconds: 300

robot:
  hardware_config: hardware_talon_config.yaml
  ecat_id: 0
  urdf: ../models/talon/robot.urdf
  base_link: base_link
  tip_link: link_7
  joint_binding: joint_binding.yaml
  payload: payload.yaml
  frames: frames.yaml

scripts: scripts
web_root: ../web

logging:
  directory: ../logs
  file_level: info
  console_level: info
  max_file_size_mib: 50
  max_files: 20
  flush_interval_ms: 1000

diagnostics:
  host: "0.0.0.0"
  port: 8082
  max_sse_clients: 4
  max_downloads: 1
