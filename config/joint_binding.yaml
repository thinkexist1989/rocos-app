# JointBinding 配置文件示例
# 本文件为可选配置。不存在时，系统使用默认顺序绑定（model joint 按顺序对应 hardware drive）

binding_policy: explicit

joint_bindings:
  - joint_name: joint_1
    drive_id: 0
  - joint_name: joint_2
    drive_id: 1
  - joint_name: joint_3
    drive_id: 2
  - joint_name: joint_4
    drive_id: 3
  - joint_name: joint_5
    drive_id: 4
  - joint_name: joint_6
    drive_id: 5
  - joint_name: joint_7
    drive_id: 6
